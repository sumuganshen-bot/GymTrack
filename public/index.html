<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>GymTrack</title>
<style>
  *,*::before,*::after { box-sizing: border-box; }
  body, html { margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #1f2937; background: #f3f4f6; }
  button { font: inherit; cursor: pointer; }
  input, select, textarea, button { font: inherit; }

  /* ---- Login ---- */
  #login-screen {
    position: fixed; inset: 0; background: #BFBFBF;
    display: flex; align-items: center; justify-content: center; z-index: 999;
  }
  .login-card {
    position: fixed; left: 50%; top: 50%; transform: translate(-50%,-50%);
    background: #fff; padding: 32px; width: 360px; border-radius: 8px;
    box-shadow: 0 12px 40px rgba(0,0,0,.18);
  }
  .login-card h1 { margin: 0 0 4px; font-size: 22px; }
  .login-card p.sub { margin: 0 0 18px; color: #6b7280; font-size: 13px; }
  .login-card label { display: block; margin: 10px 0 4px; font-size: 12px; color: #374151; }
  .login-card input { width: 100%; padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 6px; }
  .login-card button.login-btn {
    width: 100%; margin-top: 16px; padding: 10px 12px;
    background: #111827; color: #fff; border: 0; border-radius: 6px; font-weight: 600;
  }
  .login-card .err { color: #b91c1c; font-size: 12px; margin-top: 8px; min-height: 16px; }
  .quick-logins { margin-top: 16px; border-top: 1px solid #e5e7eb; padding-top: 14px; }
  .quick-logins .ql-label { font-size: 11px; color: #6b7280; margin-bottom: 8px; }
  .quick-logins .ql-btns { display: flex; flex-wrap: wrap; gap: 6px; }
  .quick-logins .ql-btns button {
    padding: 6px 12px; border: 1px solid #d1d5db; background: #f9fafb;
    border-radius: 6px; font-size: 12px; font-weight: 500; color: #374151;
  }
  .quick-logins .ql-btns button:hover { background: #e5e7eb; }

  /* ---- App shell ---- */
  header.topbar {
    background: #111827; color: #fff; padding: 12px 20px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .brand { font-weight: 700; letter-spacing: .3px; }
  .who { font-size: 13px; opacity: .85; }
  .who button { margin-left: 12px; background: transparent; color: #fff; border: 1px solid #4b5563; padding: 4px 10px; border-radius: 4px; }
  nav.tabs { display: flex; background: #fff; border-bottom: 1px solid #e5e7eb; padding: 0 12px; overflow-x: auto; }
  nav.tabs button {
    background: transparent; border: 0; padding: 12px 16px; color: #374151;
    border-bottom: 2px solid transparent; font-weight: 500;
  }
  nav.tabs button.active { color: #111827; border-bottom-color: #111827; }
  main { padding: 18px 22px 60px; max-width: 1400px; margin: 0 auto; }

  .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; padding: 16px; margin-bottom: 16px; }
  .card h2 { margin: 0 0 12px; font-size: 16px; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; }
  .col { flex: 1 1 240px; }
  .kpi { font-size: 24px; font-weight: 700; }
  .muted { color: #6b7280; font-size: 12px; }
  .pill { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; }
  .pill.hot { background: #fee2e2; color: #b91c1c; }
  .pill.cold { background: #dbeafe; color: #1d4ed8; }
  .pill.green { background: #dcfce7; color: #166534; }
  .pill.amber { background: #fef3c7; color: #92400e; }
  .pill.red { background: #fee2e2; color: #b91c1c; }
  .pill.gray { background: #e5e7eb; color: #374151; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { padding: 8px 10px; border-bottom: 1px solid #f1f5f9; text-align: left; vertical-align: top; }
  th { background: #f9fafb; font-weight: 600; color: #374151; }
  tr:hover td { background: #fafafa; }

  .btn { background: #111827; color: #fff; border: 0; padding: 8px 12px; border-radius: 6px; font-weight: 500; }
  .btn.secondary { background: #fff; color: #111827; border: 1px solid #d1d5db; }
  .btn.small { padding: 4px 8px; font-size: 12px; }
  .btn.danger { background: #b91c1c; }

  .progress { background: #e5e7eb; border-radius: 999px; height: 8px; overflow: hidden; }
  .progress > div { background: #16a34a; height: 100%; }

  /* pipeline */
  .pipeline { display: grid; grid-template-columns: repeat(5, minmax(0,1fr)); gap: 12px; }
  .pipe-col { background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 8px; padding: 10px; min-height: 260px; }
  .pipe-col h3 { margin: 0 0 8px; font-size: 13px; color: #374151; text-transform: uppercase; letter-spacing: .4px; display: flex; justify-content: space-between; align-items: center; }
  .pipe-col h3 .count { background: #e5e7eb; color: #374151; font-size: 11px; padding: 2px 8px; border-radius: 999px; }
  .lead-card {
    background: #fff; border: 1px solid #e5e7eb; border-radius: 6px; padding: 8px; margin-bottom: 8px;
    cursor: grab; font-size: 13px;
  }
  .lead-card.dragging { opacity: .4; }
  .pipe-col.drop-over { background: #eef2ff; }
  .lead-card .lname { font-weight: 600; }
  .lead-card .lmeta { color: #6b7280; font-size: 11px; margin-top: 2px; }

  /* calendar */
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .cal-cell { background: #fff; border: 1px solid #e5e7eb; min-height: 80px; padding: 4px; font-size: 11px; }
  .cal-cell .d { font-weight: 600; color: #6b7280; }
  .cal-cell.today { outline: 2px solid #111827; }
  .cal-evt { background: #dbeafe; color: #1d4ed8; padding: 2px 4px; margin-top: 2px; border-radius: 3px; cursor: pointer; }
  .cal-evt.tour { background: #dcfce7; color: #166534; }
  .cal-evt.followup { background: #fef3c7; color: #92400e; }
  .cal-evt.call { background: #ede9fe; color: #5b21b6; }

  /* modal */
  .modal-back { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: center; justify-content: center; z-index: 500; }
  .modal { background: #fff; border-radius: 8px; padding: 20px; width: 440px; max-width: 95vw; max-height: 90vh; overflow: auto; }
  .modal h3 { margin: 0 0 12px; }
  .modal label { display: block; font-size: 12px; color: #374151; margin: 8px 0 4px; }
  .modal input, .modal select, .modal textarea { width: 100%; padding: 8px; border: 1px solid #d1d5db; border-radius: 6px; }
  .modal .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; }

  .bar-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; font-size: 12px; }
  .bar-row .lbl { flex: 0 0 130px; }
  .bar-row .bar { flex: 1; height: 8px; background: #e5e7eb; border-radius: 999px; overflow: hidden; }
  .bar-row .bar > div { height: 100%; }
  .bar-row .val { flex: 0 0 50px; text-align: right; color: #374151; }

  .alert {
    background: #fef3c7; border: 1px solid #fde68a; color: #92400e;
    padding: 10px 12px; border-radius: 6px; font-size: 13px; margin-bottom: 12px;
  }

  details.audit { margin-top: 4px; }
  details.audit summary { cursor: pointer; font-size: 11px; color: #6b7280; }
  details.audit .trail { font-size: 11px; color: #374151; padding-left: 12px; margin-top: 4px; }

  /* ratios */
  .ratio-card { text-align: center; padding: 16px; }
  .ratio-card .ratio-val { font-size: 28px; font-weight: 700; }
  .ratio-card .ratio-label { font-size: 12px; color: #6b7280; margin-top: 4px; }
  .ratio-card .ratio-bench { font-size: 11px; color: #9ca3af; }
  .ratio-card.status-green { border-color: #16a34a; }
  .ratio-card.status-green .ratio-val { color: #16a34a; }
  .ratio-card.status-amber { border-color: #d97706; }
  .ratio-card.status-amber .ratio-val { color: #d97706; }
  .ratio-card.status-red { border-color: #dc2626; }
  .ratio-card.status-red .ratio-val { color: #dc2626; }

  .bench-chart { margin-top: 12px; }
  .bench-row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .bench-row .bench-lbl { flex: 0 0 130px; font-size: 12px; }
  .bench-row .bench-bars { flex: 1; position: relative; height: 24px; }
  .bench-row .bench-bars .you-bar { height: 10px; border-radius: 4px; position: absolute; top: 0; }
  .bench-row .bench-bars .af-bar { height: 10px; border-radius: 4px; position: absolute; top: 13px; background: #d1d5db; }
  .bench-row .bench-vals { flex: 0 0 90px; font-size: 11px; text-align: right; }
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<div id="login-screen">
  <div class="login-card">
    <h1>GymTrack</h1>
    <p class="sub">AF Trillium &middot; Sungai Besi</p>
    <form id="login-form">
      <label>Username</label>
      <input id="login-username" autocomplete="username" required />
      <label>Password</label>
      <input id="login-password" type="password" autocomplete="current-password" required />
      <button type="submit" class="login-btn">Sign in</button>
      <div class="err" id="login-error"></div>
    </form>
    <div class="quick-logins">
      <div class="ql-label">Quick login</div>
      <div class="ql-btns">
        <button onclick="quickLogin('fauzi','fauzi123')">Fauzi (ABM)</button>
        <button onclick="quickLogin('shamin','shamin123')">Shamin (CM)</button>
        <button onclick="quickLogin('sumugan','sc123')">Sumugan (SC)</button>
        <button onclick="quickLogin('fatihah','fat123')">Fatihah (SC)</button>
        <button onclick="quickLogin('faez','faez123')">Faez (SC)</button>
      </div>
    </div>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="app" style="display:none">
  <header class="topbar">
    <div class="brand">GymTrack</div>
    <div class="who">
      <span id="who-text"></span>
      <button id="logout-btn">Log out</button>
    </div>
  </header>
  <nav class="tabs" id="tab-nav"></nav>
  <main id="view"></main>
</div>

<script>
// ============ State ============
const state = {
  token: localStorage.getItem('gymtrack.token') || null,
  user: JSON.parse(localStorage.getItem('gymtrack.user') || 'null'),
  leads: [],
  appointments: [],
  targets: [],
  ratios: [],
  users: [],
  currentTab: 'dashboard',
  calendarView: 'month',
  calendarAnchor: new Date(),
  ratioView: 'combined',
  ratioPeriodType: 'daily',
  ratioMonth: new Date().toISOString().slice(0,7),
};

const STAGES = ['New', 'Contacted', 'Appointment booked', 'Showed', 'Joined'];
const BRANCH_LABEL = { sb: 'Sungai Besi', bg: 'Bangsar', os: 'Old Klang Road' };
const ROLE_TABS = {
  abm:   ['dashboard','pipeline','ratios','calendar','allLeads','org'],
  cm:    ['dashboard','pipeline','ratios','calendar','allLeads','org'],
  sc:    ['dashboard','pipeline','ratios','calendar','allLeads'],
};
const TAB_LABELS = {
  dashboard: 'Dashboard',
  pipeline:  'Pipeline',
  ratios:    'Ratios',
  calendar:  'Calendar',
  allLeads:  'All leads',
  org:       'Org & Team',
};

const AF_BENCHMARKS = {
  callPickedUp: 0.16,
  callToAppt:   0.15,
  apptToShow:   0.40,
  showToClose:  0.50,
};

// ============ API ============
async function api(path, opts = {}) {
  const headers = Object.assign({ 'Content-Type': 'application/json' }, opts.headers || {});
  if (state.token) headers.Authorization = 'Bearer ' + state.token;
  const res = await fetch(path, Object.assign({}, opts, { headers }));
  if (res.status === 401) { logout(); throw new Error('unauthorized'); }
  if (!res.ok) { const msg = await res.text(); throw new Error(msg || ('HTTP ' + res.status)); }
  if (res.status === 204) return null;
  return res.json();
}

async function loadAll() {
  const promises = [
    api('/api/leads'),
    api('/api/appointments'),
    api('/api/targets'),
    api('/api/ratios?period_type=' + state.ratioPeriodType + '&month=' + state.ratioMonth),
  ];
  if (state.user.role !== 'sc') promises.push(api('/api/users'));
  const [leads, appts, targets, ratios, users] = await Promise.all(promises);
  state.leads = leads;
  state.appointments = appts;
  state.targets = targets;
  state.ratios = ratios;
  if (users) state.users = users;
}

// ============ Auth ============
function logout() {
  localStorage.removeItem('gymtrack.token');
  localStorage.removeItem('gymtrack.user');
  state.token = null; state.user = null;
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('app').style.display = 'none';
}

document.getElementById('logout-btn').onclick = logout;

window.quickLogin = (u, p) => {
  document.getElementById('login-username').value = u;
  document.getElementById('login-password').value = p;
  document.getElementById('login-form').dispatchEvent(new Event('submit', { cancelable: true }));
};

document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const err = document.getElementById('login-error');
  err.textContent = '';
  const username = document.getElementById('login-username').value.trim();
  const password = document.getElementById('login-password').value;
  try {
    const r = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password }),
    });
    if (!r.ok) { err.textContent = 'Invalid credentials'; return; }
    const data = await r.json();
    state.token = data.token; state.user = data.user;
    localStorage.setItem('gymtrack.token', data.token);
    localStorage.setItem('gymtrack.user', JSON.stringify(data.user));
    await bootApp();
  } catch (e) { err.textContent = 'Login failed'; }
});

// ============ Boot ============
async function bootApp() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  const dn = state.user.displayName || state.user.username;
  document.getElementById('who-text').textContent = `${dn} · ${state.user.role.toUpperCase()} · ${state.user.branches.map(b => BRANCH_LABEL[b] || b).join(', ')}`;
  renderTabs();
  try { await loadAll(); } catch (e) { console.error(e); }
  render();
}

function renderTabs() {
  const nav = document.getElementById('tab-nav');
  const tabs = ROLE_TABS[state.user.role] || ROLE_TABS.sc;
  if (!tabs.includes(state.currentTab)) state.currentTab = tabs[0];
  nav.innerHTML = '';
  for (const t of tabs) {
    const b = document.createElement('button');
    b.textContent = TAB_LABELS[t];
    if (t === state.currentTab) b.className = 'active';
    b.onclick = () => { state.currentTab = t; renderTabs(); render(); };
    nav.appendChild(b);
  }
}

// ============ Helpers ============
function daysSince(iso) { if (!iso) return 0; return Math.floor((Date.now() - new Date(iso).getTime()) / 86400000); }
function todayIso() { return new Date().toISOString().slice(0,10); }
function monthKey(d=new Date()) { return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0'); }
function escapeHtml(s) { return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// ============ Render router ============
function render() {
  const v = document.getElementById('view');
  v.innerHTML = '';
  switch (state.currentTab) {
    case 'dashboard': return renderDashboard(v);
    case 'pipeline':  return renderPipeline(v);
    case 'ratios':    return renderRatios(v);
    case 'calendar':  return renderCalendar(v);
    case 'allLeads':  return renderAllLeads(v);
    case 'org':       return renderOrg(v);
  }
}

// ---------- Dashboard ----------
function renderDashboard(root) {
  const mk = monthKey();
  const thisMonthLeads = state.leads.filter(l => l.dateAdded && l.dateAdded.startsWith(mk));
  const thisMonthAppts = state.appointments.filter(a => a.date && a.date.startsWith(mk));
  const joined = state.leads.filter(l => l.stage === 'Joined' && l.dateAdded && l.dateAdded.startsWith(mk));

  const myTarget = state.targets.find(t => t.owner === state.user.username && t.month === mk);
  const leadsTarget = myTarget ? myTarget.leadsTarget : 20;
  const pct = (n,t) => t ? Math.min(100, Math.round(n/t*100)) : 0;

  const inactive = state.leads.filter(l =>
    l.stage !== 'Joined' && l.stage !== 'Lost' && daysSince(l.lastTouched) >= 7
  );

  const sourceCounts = {};
  for (const l of state.leads) sourceCounts[l.source] = (sourceCounts[l.source] || 0) + 1;
  const maxSrc = Math.max(1, ...Object.values(sourceCounts));

  root.innerHTML = `
    ${inactive.length ? `<div class="alert">⚠ ${inactive.length} lead${inactive.length>1?'s':''} not touched in 7+ days. Review under "All leads".</div>` : ''}
    <div class="row">
      <div class="col card"><div class="muted">Leads this month</div><div class="kpi">${thisMonthLeads.length}</div>
        <div class="progress" style="margin-top:6px"><div style="width:${pct(thisMonthLeads.length, leadsTarget)}%"></div></div>
        <div class="muted">Target ${leadsTarget}</div></div>
      <div class="col card"><div class="muted">Appointments this month</div><div class="kpi">${thisMonthAppts.length}</div></div>
      <div class="col card"><div class="muted">Joined this month</div><div class="kpi">${joined.length}</div></div>
      <div class="col card"><div class="muted">Inactive leads (7d+)</div><div class="kpi">${inactive.length}</div>
        <div class="muted">Needs follow-up</div></div>
    </div>
    <div class="card">
      <h2>Source breakdown</h2>
      ${Object.entries(sourceCounts).map(([s,c]) => `
        <div class="bar-row">
          <span class="lbl">${escapeHtml(s)}</span>
          <div class="bar"><div style="width:${c/maxSrc*100}%; background:#2563eb"></div></div>
          <span class="val">${c}</span>
        </div>
      `).join('') || '<div class="muted">No leads yet</div>'}
    </div>
    <div class="card">
      <h2>Today &amp; tomorrow</h2>
      ${renderUpcomingTable()}
    </div>
  `;
}

function renderUpcomingTable() {
  const today = todayIso();
  const tom = new Date(); tom.setDate(tom.getDate()+1);
  const tomIso = tom.toISOString().slice(0,10);
  const list = state.appointments
    .filter(a => a.date === today || a.date === tomIso)
    .sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
  if (!list.length) return '<div class="muted">Nothing scheduled.</div>';
  return `<table><thead><tr><th>When</th><th>Lead</th><th>Type</th><th>Status</th><th></th></tr></thead><tbody>
    ${list.map(a => `
      <tr>
        <td>${a.date} ${a.time}</td>
        <td>${escapeHtml(a.leadName)}<br/><span class="muted">${escapeHtml(a.phone||'')}</span></td>
        <td><span class="pill gray">${a.type}</span></td>
        <td>${apptStatusPill(a.status)}</td>
        <td>
          <button class="btn small secondary" onclick="markAppt(${a.id},'showed')">Showed</button>
          <button class="btn small secondary" onclick="markAppt(${a.id},'noshow')">No-show</button>
        </td>
      </tr>
    `).join('')}
  </tbody></table>`;
}
function apptStatusPill(s) {
  if (s==='showed')  return '<span class="pill green">Showed</span>';
  if (s==='noshow')  return '<span class="pill red">No-show</span>';
  return '<span class="pill gray">Scheduled</span>';
}

window.markAppt = async (id, status) => {
  await api('/api/appointments/'+id, { method:'PUT', body: JSON.stringify({ status }) });
  await loadAll(); render();
};

// ---------- Pipeline (drag & drop) ----------
function renderPipeline(root) {
  const cols = STAGES.map(stage => {
    const leads = state.leads.filter(l => l.stage === stage);
    return `
      <div class="pipe-col" data-stage="${stage}">
        <h3>${stage} <span class="count">${leads.length}</span></h3>
        ${leads.map(l => `
          <div class="lead-card" draggable="true" data-id="${l.id}">
            <div class="lname">${escapeHtml(l.name)} <span class="pill ${l.temperature==='Hot'?'hot':'cold'}">${l.temperature}</span></div>
            <div class="lmeta">${escapeHtml(l.phone||'')} · ${escapeHtml(l.source||'')}</div>
            <div class="lmeta">Owner: ${escapeHtml(l.owner)}</div>
            <div style="margin-top:6px; display:flex; gap:4px; flex-wrap:wrap">
              <button class="btn small secondary" onclick="editLead(${l.id})">Edit</button>
              <button class="btn small secondary" onclick="bookAppt(${l.id})">Book</button>
            </div>
          </div>
        `).join('')}
      </div>`;
  }).join('');

  root.innerHTML = `
    <div class="card" style="display:flex;justify-content:space-between;align-items:center">
      <h2 style="margin:0">Pipeline</h2>
      <button class="btn" onclick="newLead()">+ New lead</button>
    </div>
    <div class="pipeline">${cols}</div>
  `;

  let draggingId = null;
  root.querySelectorAll('.lead-card').forEach(el => {
    el.addEventListener('dragstart', () => { draggingId = el.dataset.id; el.classList.add('dragging'); });
    el.addEventListener('dragend',   () => { el.classList.remove('dragging'); draggingId = null; });
  });
  root.querySelectorAll('.pipe-col').forEach(col => {
    col.addEventListener('dragover', (e) => { e.preventDefault(); col.classList.add('drop-over'); });
    col.addEventListener('dragleave', () => col.classList.remove('drop-over'));
    col.addEventListener('drop', async (e) => {
      e.preventDefault(); col.classList.remove('drop-over');
      if (!draggingId) return;
      const newStage = col.dataset.stage;
      const lead = state.leads.find(l => String(l.id) === String(draggingId));
      if (!lead || lead.stage === newStage) return;
      await api('/api/leads/'+lead.id, { method:'PUT', body: JSON.stringify({ stage: newStage }) });
      if (newStage === 'Appointment booked') bookAppt(lead.id);
      await loadAll(); render();
    });
  });
}

// ---------- Ratios ----------
function renderRatios(root) {
  const role = state.user.role;
  const scs = state.users.filter(u => u.role === 'sc') || [];
  const canViewOthers = role === 'abm' || role === 'cm';

  let viewSelector = '';
  if (canViewOthers) {
    const opts = ['<option value="combined">All SCs (Combined)</option>'];
    for (const sc of scs) {

async function reloadRatios() {
  state.ratios = await api('/api/ratios?period_type=' + state.ratioPeriodType + '&month=' + state.ratioMonth);
}

function renderRatioBody() {
  const body = document.getElementById('ratio-body');
  if (!body) return;

  let data = state.ratios;
  if (state.ratioView !== 'combined' && state.user.role !== 'sc') {
    data = data.filter(r => r.owner === state.ratioView);
  }

  const totals = { callsPlaced: 0, pickedUp: 0, apptsSet: 0, showedUp: 0, closed: 0 };
  for (const r of data) {
    totals.callsPlaced += r.callsPlaced;
    totals.pickedUp += r.pickedUp;
    totals.apptsSet += r.apptsSet;
    totals.showedUp += r.showedUp;
    totals.closed += r.closed;
  }

  const ratios = {
    callPickedUp: totals.callsPlaced ? totals.pickedUp / totals.callsPlaced : 0,
    callToAppt:   totals.pickedUp ? totals.apptsSet / totals.pickedUp : 0,
    apptToShow:   totals.apptsSet ? totals.showedUp / totals.apptsSet : 0,
    showToClose:  totals.showedUp ? totals.closed / totals.showedUp : 0,
  };

  function statusClass(val, bench) {
    if (val >= bench) return 'status-green';
    if (val >= bench * 0.7) return 'status-amber';
    return 'status-red';
  }

  const cards = [
    { label: 'Call picked up %', val: ratios.callPickedUp, bench: AF_BENCHMARKS.callPickedUp },
    { label: 'Call to appt %', val: ratios.callToAppt, bench: AF_BENCHMARKS.callToAppt },
    { label: 'Appt to show %', val: ratios.apptToShow, bench: AF_BENCHMARKS.apptToShow },
    { label: 'Show to close %', val: ratios.showToClose, bench: AF_BENCHMARKS.showToClose },
  ];

  const hasData = totals.callsPlaced > 0;

  body.innerHTML = `
    <div class="row" style="margin-bottom:16px">
      ${cards.map(c => `
        <div class="col card ratio-card ${hasData ? statusClass(c.val, c.bench) : ''}">
          <div class="ratio-val">${hasData ? Math.round(c.val*100)+'%' : '—'}</div>
          <div class="ratio-label">${c.label}</div>
          <div class="ratio-bench">AF Benchmark: ${Math.round(c.bench*100)}%</div>
        </div>
      `).join('')}
    </div>

    ${hasData ? `
    <div class="card">
      <h2>You vs AF Benchmarks</h2>
      <div class="bench-chart">
        ${cards.map(c => {
          const youPct = Math.min(100, Math.round(c.val * 100));
          const afPct = Math.round(c.bench * 100);
          const maxPct = Math.max(youPct, afPct, 1);
          const youW = youPct / maxPct * 100;
          const afW = afPct / maxPct * 100;
          const youColor = statusClass(c.val, c.bench) === 'status-green' ? '#16a34a' : statusClass(c.val, c.bench) === 'status-amber' ? '#d97706' : '#dc2626';
          return `
            <div class="bench-row">
              <div class="bench-lbl">${c.label}</div>
              <div class="bench-bars">
                <div class="you-bar" style="width:${youW}%;background:${youColor}"></div>
                <div class="af-bar" style="width:${afW}%"></div>
              </div>
              <div class="bench-vals">${youPct}% / ${afPct}%</div>
            </div>
          `;
        }).join('')}
        <div style="font-size:11px;color:#6b7280;margin-top:8px">Top bar = You &middot; Bottom bar = AF Benchmark</div>
      </div>
    </div>
    ` : '<div class="card"><div class="muted">No ratio data for this period. Use "+ Log numbers" to enter your daily/weekly/monthly activity.</div></div>'}

    <div class="card" style="padding:0;overflow:auto">
      <table>
        <thead><tr><th>Period</th><th>Owner</th><th>Calls</th><th>Picked up</th><th>Appts set</th><th>Showed</th><th>Closed</th></tr></thead>
        <tbody>
          ${data.length ? data.map(r => `
            <tr>
              <td>${r.period}</td><td>${escapeHtml(r.owner)}</td>
              <td>${r.callsPlaced}</td><td>${r.pickedUp}</td>
              <td>${r.apptsSet}</td><td>${r.showedUp}</td><td>${r.closed}</td>
            </tr>
          `).join('') : '<tr><td colspan="7" class="muted">No data</td></tr>'}
        </tbody>
      </table>
    </div>
  `;
}

function renderCalendar(root) {
  const v = state.calendarView;
  root.innerHTML = `
    <div class="card" style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
      <button class="btn secondary" onclick="calNav(-1)">◀</button>
      <strong id="cal-title"></strong>
      <button class="btn secondary" onclick="calNav(1)">▶</button>
      <span style="flex:1"></span>
      <button class="btn ${v==='month'?'':'secondary'}" onclick="calView('month')">Month</button>
      <button class="btn ${v==='week'?'':'secondary'}"  onclick="calView('week')">Week</button>
      <button class="btn" onclick="newAppt()">+ New appointment</button>
    </div>
    <div id="cal-body" class="card"></div>
  `;
  if (v === 'month') drawMonth();
  else drawWeek();
}
window.calNav = (delta) => {
  const d = state.calendarAnchor;
  if (state.calendarView === 'month') d.setMonth(d.getMonth() + delta);
  else d.setDate(d.getDate() + 7 * delta);
  render();
};
window.calView = (v) => { state.calendarView = v; render(); };

function drawMonth() {
  const d = state.calendarAnchor;
  const y = d.getFullYear(), m = d.getMonth();
  document.getElementById('cal-title').textContent =
    d.toLocaleString(undefined,{month:'long', year:'numeric'});
  const first = new Date(y, m, 1);
  const start = new Date(first); start.setDate(1 - first.getDay());
  const cells = [];
  for (let i=0; i<42; i++) { const dd = new Date(start); dd.setDate(start.getDate()+i); cells.push(dd); }
  const today = todayIso();
  const html = ['<div class="cal-grid">'];
  ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].forEach(n => html.push(`<div class="cal-cell" style="min-height:auto;background:#f9fafb"><div class="d">${n}</div></div>`));
  for (const c of cells) {
    const iso = c.toISOString().slice(0,10);
    const inMonth = c.getMonth() === m;
    const evts = state.appointments.filter(a => a.date === iso);
    html.push(`<div class="cal-cell ${iso===today?'today':''}" style="${inMonth?'':'opacity:.4'}">
      <div class="d">${c.getDate()}</div>
      ${evts.map(a => `<div class="cal-evt ${a.type}" onclick="editAppt(${a.id})">${a.time} ${escapeHtml(a.leadName)}</div>`).join('')}
    </div>`);
  }
  html.push('</div>');
  document.getElementById('cal-body').innerHTML = html.join('');
}
function drawWeek() {
  const d = state.calendarAnchor;
  const start = new Date(d); start.setDate(d.getDate() - d.getDay());
  document.getElementById('cal-title').textContent = 'Week of ' + start.toLocaleDateString();
  const today = todayIso();
  const html = ['<div class="cal-grid">'];
  for (let i=0; i<7; i++) {
    const c = new Date(start); c.setDate(start.getDate()+i);
    const iso = c.toISOString().slice(0,10);
    const evts = state.appointments.filter(a => a.date === iso).sort((a,b)=>a.time.localeCompare(b.time));
    html.push(`<div class="cal-cell ${iso===today?'today':''}" style="min-height:200px">
      <div class="d">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][i]} ${c.getDate()}/${c.getMonth()+1}</div>
      ${evts.map(a => `<div class="cal-evt ${a.type}" onclick="editAppt(${a.id})">${a.time}<br/>${escapeHtml(a.leadName)}</div>`).join('')}
    </div>`);
  }
  html.push('</div>');
  document.getElementById('cal-body').innerHTML = html.join('');
}

  const rows = [['Name','Phone','Source','Stage','Temperature','Owner','Branch','DateAdded','LastTouched','Notes']];
  for (const l of state.leads) {
    rows.push([l.name,l.phone,l.source,l.stage,l.temperature,l.owner,l.branch,l.dateAdded,l.lastTouched,(l.notes||'').replace(/\n/g,' ')]);
  }
  const csv = rows.map(r => r.map(c => `"${String(c||'').replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob([csv], {type:'text/csv'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'gymtrack-leads-' + todayIso() + '.csv';
  a.click();
};

  document.body.appendChild(back);

}

    else   await api('/api/appointments',       { method:'POST', body: JSON.stringify(body)});
    m.remove();
    if (sendWa && body.phone) {
      const text = encodeURIComponent(
        `Hi ${body.leadName}, this is GymTrack confirming your ${body.type} on ${body.date} at ${body.time}. See you then!`
      );
      const phone = body.phone.replace(/\D/g,'');
      window.open(`https://wa.me/${phone}?text=${text}`, '_blank');
    }
    await loadAll(); render();
  };
};

// ============ Init ============
if (state.token && state.user) { bootApp(); }
</script>
</body>
</html>
