<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>GymTrack</title>
<style>
  *,*::before,*::after { box-sizing: border-box; }
  body, html { margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, -apple-system, BlinkMacSystemFont, sans-serif; color: #e8eaed; background: #101214; }
  button { font: inherit; cursor: pointer; }
  input, select, textarea, button { font: inherit; }
  input, select, textarea { color: #e8eaed; }
  select option { background: #23272e; color: #e8eaed; }
  ::placeholder { color: #7d8590; }

  /* ---- Palette ---- */
  :root {
    --primary: #00A86B;
    --primary-dark: #00875a;
    --primary-light: #123527;
    --accent: #e8542e;
    --green: #5cb85c;
    --green-bg: #dff0d8;
    --amber: #f0ad4e;
    --amber-bg: #fcf8e3;
    --red: #d9534f;
    --red-bg: #f2dede;
    --border: #3a4046;
    --bg-card: #23272e;
    --bg-page: #101214;
    --text-primary: #f0f2f5;
    --text-muted: #9aa4b3;
    --header-bg: #00A86B;
  }

  /* ---- Global hover ---- */
  .btn, nav.tabs button, .lead-card, .cal-evt, .pill {
    transition: all 0.15s ease;
  }
  .btn:hover { box-shadow: 0 3px 10px rgba(0,168,107,.25); transform: translateY(-1px); }
  .btn.secondary:hover { background: #2f343b; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
  .btn.danger:hover { background: #c9302c; }
  nav.tabs button:hover { background: rgba(0,168,107,.12); color: var(--primary); }
  .lead-card:hover { box-shadow: 0 3px 12px rgba(0,0,0,.1); border-left-color: var(--primary); }
  .cal-evt:hover { filter: brightness(0.92); box-shadow: 0 2px 6px rgba(0,0,0,.1); }
  .card { transition: box-shadow 0.15s ease; }
  .card:hover { box-shadow: 0 2px 12px rgba(0,0,0,.06); }

  /* ---- Logo ---- */
  .logo-icon {
    display: inline-flex; align-items: center; justify-content: center;
    margin-right: 6px; vertical-align: middle;
  }
  .logo-icon svg { width: 32px; height: 32px; }
  .logo-text { font-weight: 700; font-size: 20px; letter-spacing: 0.5px; text-transform: uppercase; }
  .logo-text .ym { font-weight: 700; }

  /* login logo */
  .login-logo { display: flex; align-items: center; justify-content: center; margin-bottom: 8px; }
  .login-logo .logo-icon svg { width: 44px; height: 44px; }
  .login-logo .logo-text { font-size: 30px; color: var(--primary); }

  /* ---- Login ---- */
  #login-screen {
    position: fixed; inset: 0; background: linear-gradient(135deg, #1c1f24 0%, #0c0e10 100%);
    display: flex; align-items: center; justify-content: center; z-index: 999;
  }
  .login-card {
    position: fixed; left: 50%; top: 50%; transform: translate(-50%,-50%);
    background: #23272e; padding: 40px; width: 400px; border-radius: 8px;
    box-shadow: 0 20px 60px rgba(0,0,0,.3);
  }
  .login-card p.sub { margin: 0 0 24px; color: var(--text-muted); font-size: 13px; text-align: center; }
  .login-card label { display: block; margin: 12px 0 4px; font-size: 12px; color: #c3cad2; font-weight: 600; text-transform: uppercase; letter-spacing: .5px; }
  .login-card input { width: 100%; padding: 10px 14px; border: 1px solid var(--border); border-radius: 4px; background: #262a30; transition: border-color 0.15s; }
  .login-card input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(0,168,107,.15); background: #23272e; }
  .login-card button.login-btn {
    width: 100%; margin-top: 20px; padding: 12px 14px;
    background: var(--primary); color: #fff; border: 0; border-radius: 4px; font-weight: 600; font-size: 14px;
    text-transform: uppercase; letter-spacing: .5px;
    transition: all 0.15s ease;
  }
  .login-card button.login-btn:hover { background: var(--primary-dark); box-shadow: 0 4px 12px rgba(0,168,107,.3); }
  .login-card .err { color: var(--red); font-size: 12px; margin-top: 8px; min-height: 16px; text-align: center; }
  .quick-logins { margin-top: 20px; border-top: 1px solid var(--border); padding-top: 16px; }
  .quick-logins .ql-label { font-size: 10px; color: var(--text-muted); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; text-align: center; }
  .quick-logins .ql-btns { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
  .quick-logins .ql-btns button {
    padding: 6px 14px; border: 1px solid var(--border); background: #262a30;
    border-radius: 4px; font-size: 12px; font-weight: 500; color: #c3cad2;
    transition: all 0.15s ease;
  }
  .quick-logins .ql-btns button:hover { background: var(--primary-light); border-color: var(--primary); color: var(--primary); }

  /* ---- App shell ---- */
  header.topbar {
    background: linear-gradient(180deg, #2b2f36 0%, #16181c 100%); color: #fff; padding: 0 24px;
    display: flex; align-items: center; justify-content: space-between;
    height: 52px;
    box-shadow: 0 2px 8px rgba(0,0,0,.15);
  }
  .brand { font-weight: 700; letter-spacing: 1px; display: flex; align-items: center; }
  .who { font-size: 13px; opacity: .9; display: flex; align-items: center; gap: 12px; }
  .who button { background: rgba(255,255,255,.15); color: #fff; border: 1px solid rgba(255,255,255,.3); padding: 5px 14px; border-radius: 4px; font-size: 12px; }
  .who button:hover { background: rgba(255,255,255,.25); }
  nav.tabs { display: flex; background: #23272e; border-bottom: 2px solid var(--border); padding: 0 16px; overflow-x: auto; }
  nav.tabs button {
    background: transparent; border: 0; padding: 14px 20px; color: #b8c0c9;
    border-bottom: 3px solid transparent; font-weight: 500; font-size: 13px;
    text-transform: uppercase; letter-spacing: .3px; margin-bottom: -2px;
  }
  nav.tabs button.active { color: var(--primary); border-bottom-color: var(--primary); font-weight: 600; }
  main { padding: 20px 24px 60px; max-width: 1400px; margin: 0 auto; }

  .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 6px; padding: 18px; margin-bottom: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.04); }
  .card h2 { margin: 0 0 14px; font-size: 16px; color: var(--primary); font-weight: 600; }
  .row { display: flex; gap: 14px; flex-wrap: wrap; }
  .col { flex: 1 1 240px; }

  /* KPI cards */
  .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; margin-bottom: 16px; }
  .kpi-card { background: #23272e; border: 1px solid var(--border); border-radius: 6px; padding: 18px; border-left: 4px solid var(--primary); box-shadow: 0 1px 3px rgba(0,0,0,.04); }
  .kpi-card .kpi-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 6px; }
  .kpi-card .kpi-val { font-size: 28px; font-weight: 700; color: var(--text-primary); }
  .kpi-card .kpi-sub { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
  .kpi-card.green { border-left-color: var(--green); }
  .kpi-card.amber { border-left-color: var(--amber); }
  .kpi-card.red { border-left-color: var(--red); }

  .muted { color: var(--text-muted); font-size: 12px; }
  .pill { display: inline-block; padding: 2px 10px; border-radius: 3px; font-size: 11px; font-weight: 600; }
  .pill.hot { background: var(--red-bg); color: var(--red); }
  .pill.cold { background: #dbeafe; color: #1d4ed8; }
  .pill.green { background: var(--green-bg); color: #3c763d; }
  .pill.amber { background: var(--amber-bg); color: #8a6d3b; }
  .pill.red { background: var(--red-bg); color: #a94442; }
  .pill.gray { background: #2c3037; color: #c3cad2; }

  /* Tables — blue header like GymSales */
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { background: var(--primary); color: #fff; padding: 10px 12px; text-align: left; font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .3px; }
  th:first-child { border-radius: 4px 0 0 0; }
  th:last-child { border-radius: 0 4px 0 0; }
  td { padding: 10px 12px; border-bottom: 1px solid #2c3037; vertical-align: top; }
  tr:hover td { background: #262b31; }

  .btn { background: var(--primary); color: #fff; border: 0; padding: 8px 16px; border-radius: 4px; font-weight: 600; font-size: 13px; }
  .btn.secondary { background: #23272e; color: #c3cad2; border: 1px solid var(--border); }
  .btn.small { padding: 4px 10px; font-size: 12px; }
  .btn.danger { background: var(--red); color: #fff; }

  .progress { background: #33383f; border-radius: 3px; height: 8px; overflow: hidden; }
  .progress > div { background: var(--green); height: 100%; border-radius: 3px; }

  /* pipeline */
  .pipeline { display: grid; grid-template-columns: repeat(5, minmax(0,1fr)); gap: 12px; }
  .pipe-col { background: #262a30; border: 1px solid var(--border); border-radius: 6px; padding: 10px; min-height: 260px; }
  .pipe-col h3 { margin: 0 0 10px; font-size: 12px; color: var(--primary); text-transform: uppercase; letter-spacing: .5px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--primary); padding-bottom: 8px; }
  .pipe-col h3 .count { background: var(--primary); color: #fff; font-size: 11px; padding: 2px 8px; border-radius: 3px; }
  .lead-card {
    background: #23272e; border: 1px solid var(--border); border-left: 3px solid var(--primary-light); border-radius: 4px; padding: 10px; margin-bottom: 8px;
    cursor: grab; font-size: 13px;
  }
  .lead-card.dragging { opacity: .4; }
  .pipe-pager { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-bottom: 8px; font-size: 11px; color: var(--text-muted); }
  .pipe-pager button { background: #262a30; border: 1px solid var(--border); color: #c3cad2; border-radius: 4px; padding: 3px 10px; font-size: 11px; transition: all 0.15s ease; }
  .pipe-pager button:hover:not(:disabled) { background: var(--primary); color: #fff; border-color: var(--primary); }
  .pipe-pager button:disabled { opacity: .35; cursor: default; }
  .pipe-col.drop-over { background: var(--primary-light); }
  .lead-card .lname { font-weight: 600; color: var(--text-primary); }
  .lead-card .lmeta { color: var(--text-muted); font-size: 11px; margin-top: 2px; }

  /* calendar */
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .cal-cell { background: #23272e; border: 1px solid var(--border); min-height: 80px; padding: 4px; font-size: 11px; }
  .cal-cell .d { font-weight: 600; color: var(--text-muted); }
  .cal-cell.today { outline: 2px solid var(--primary); background: var(--primary-light); }
  .cal-evt { background: #dbeafe; color: #1d4ed8; padding: 2px 4px; margin-top: 2px; border-radius: 3px; cursor: pointer; font-size: 10px; }
  .cal-legend { margin-top: 12px; font-size: 11px; color: var(--text-muted); line-height: 2; }
  .cal-legend .legend-chip { display: inline-block; vertical-align: middle; margin-right: 3px; }

  /* modal */
  .modal-back { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: flex; align-items: center; justify-content: center; z-index: 500; }
  .modal { background: #23272e; border-radius: 6px; padding: 0; width: 480px; max-width: 95vw; max-height: 90vh; overflow: auto; box-shadow: 0 20px 60px rgba(0,0,0,.25); }
  .modal h3 { margin: 0; padding: 16px 20px; background: var(--primary); color: #fff; font-size: 15px; border-radius: 6px 6px 0 0; }
  .modal .modal-body { padding: 20px; }
  .modal label { display: block; font-size: 12px; color: #c3cad2; margin: 10px 0 4px; font-weight: 600; text-transform: uppercase; letter-spacing: .3px; }
  .modal input, .modal select, .modal textarea { width: 100%; padding: 9px 12px; border: 1px solid var(--border); border-radius: 4px; background: #262a30; transition: border-color 0.15s; }
  .modal input:focus, .modal select:focus, .modal textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(0,168,107,.12); background: #23272e; }
  .modal .actions { display: flex; gap: 8px; justify-content: flex-end; padding: 14px 20px; border-top: 1px solid var(--border); background: #262a30; }

  /* source bars */
  .source-bar { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; padding: 6px 0; border-bottom: 1px solid #2a2e34; }
  .source-bar .s-label { flex: 0 0 120px; font-size: 13px; color: var(--text-primary); font-weight: 500; }
  .source-bar .s-bar-wrap { flex: 1; height: 20px; background: #2c3037; border-radius: 3px; overflow: hidden; }
  .source-bar .s-bar-fill { height: 100%; border-radius: 3px; transition: width 0.3s; }
  .source-bar .s-val { flex: 0 0 40px; text-align: right; font-weight: 700; font-size: 14px; color: var(--text-primary); }

  .alert {
    background: var(--amber-bg); border-left: 4px solid var(--amber); color: #8a6d3b;
    padding: 12px 16px; border-radius: 4px; font-size: 13px; margin-bottom: 16px;
  }

  /* charts */
  .chart-flex { display: flex; gap: 20px; align-items: center; flex-wrap: wrap; justify-content: center; }
  .legend { flex: 1 1 200px; min-width: 180px; }
  .legend-row { display: flex; align-items: center; gap: 8px; padding: 7px 8px; border-bottom: 1px solid #2a2e34; font-size: 13px; }
  .legend-row:hover { background: #262b31; }
  .legend-chip { width: 12px; height: 12px; border-radius: 3px; flex: 0 0 12px; }
  .legend-label { flex: 1; color: var(--text-primary); }
  .legend-val { font-weight: 700; color: var(--text-primary); }
  .legend-pct { color: var(--text-muted); flex: 0 0 44px; text-align: right; font-size: 12px; }

  details.audit { margin-top: 4px; }
  details.audit summary { cursor: pointer; font-size: 11px; color: var(--text-muted); }
  details.audit .trail { font-size: 11px; color: #c3cad2; padding-left: 12px; margin-top: 4px; }

  /* KPI ratio table */
  .kpi-table { width: 100%; border-collapse: collapse; }
  .kpi-table th { background: var(--primary); color: #fff; padding: 10px 14px; font-size: 12px; text-transform: uppercase; }
  .kpi-table td { padding: 14px; border-bottom: 1px solid #2c3037; font-size: 14px; }
  .kpi-table tr:hover td { background: #262b31; }
  .kpi-table .kpi-name { font-weight: 500; color: var(--text-primary); }
  .kpi-table .kpi-actual { font-weight: 700; font-size: 18px; text-align: center; }
  .kpi-table .kpi-target { font-weight: 600; text-align: center; color: var(--text-muted); }
  .kpi-table .kpi-bar { width: 150px; }
  .kpi-table .bar-mini { display: flex; gap: 1px; align-items: flex-end; height: 24px; }
  .kpi-table .bar-mini span { flex: 1; border-radius: 2px 2px 0 0; min-width: 4px; }

  /* ratio cards */
  .ratio-card { text-align: center; padding: 18px; border-left: 4px solid var(--border); }
  .ratio-card .ratio-val { font-size: 28px; font-weight: 700; }
  .ratio-card .ratio-label { font-size: 12px; color: var(--text-muted); margin-top: 4px; text-transform: uppercase; letter-spacing: .3px; }
  .ratio-card .ratio-bench { font-size: 11px; color: #8a929c; margin-top: 2px; }
  .ratio-card.status-green { border-left-color: var(--green); }
  .ratio-card.status-green .ratio-val { color: var(--green); }
  .ratio-card.status-amber { border-left-color: var(--amber); }
  .ratio-card.status-amber .ratio-val { color: var(--amber); }
  .ratio-card.status-red { border-left-color: var(--red); }
  .ratio-card.status-red .ratio-val { color: var(--red); }

  .bench-chart { margin-top: 12px; }
  .bench-row { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; padding: 8px 0; border-bottom: 1px solid #2a2e34; }
  .bench-row .bench-lbl { flex: 0 0 140px; font-size: 13px; font-weight: 500; }
  .bench-row .bench-bars { flex: 1; position: relative; height: 28px; }
  .bench-row .bench-bars .you-bar { height: 12px; border-radius: 3px; position: absolute; top: 0; }
  .bench-row .bench-bars .af-bar { height: 12px; border-radius: 3px; position: absolute; top: 14px; background: #d1d5db; }
  .bench-row .bench-vals { flex: 0 0 100px; font-size: 12px; text-align: right; font-weight: 600; }

  /* Source colors */
  .src-walkin { background: #5cb85c; }
  .src-social { background: #f0ad4e; }
  .src-website { background: #d9534f; }
  .src-referral { background: #337ab7; }
  .src-whatsapp { background: #25d366; }
  .src-instagram { background: #e1306c; }
  .src-outreach { background: #5bc0de; }
  .src-other { background: #999; }
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-logo"><span class="logo-icon"><svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round"><path d="M 82 30 A 40 40 0 1 0 82 70 L 55 70" fill="none"/><line x1="50" y1="50" x2="50" y2="22"/><line x1="50" y1="50" x2="90" y2="50"/></svg></span><span class="logo-text"><span class="ym">ym</span>Track</span></div>
    <p class="sub">AF Trillium &middot; Sungai Besi</p>
    <form id="login-form">
      <label>Username</label>
      <input id="login-username" autocomplete="username" required />
      <label>Password</label>
      <input id="login-password" type="password" autocomplete="current-password" required />
      <button type="submit" class="login-btn">Sign in</button>
      <div class="err" id="login-error"></div>
    </form>
    <div class="quick-logins">
      <div class="ql-label">Quick login</div>
      <div class="ql-btns">
        <button onclick="quickLogin('fauzi','fauzi123')">Fauzi (ABM)</button>
        <button onclick="quickLogin('shamin','shamin123')">Shamin (CM)</button>
        <button onclick="quickLogin('sumugan','sc123')">Sumugan (SC)</button>
        <button onclick="quickLogin('fatihah','fat123')">Fatihah (SC)</button>
        <button onclick="quickLogin('faez','faez123')">Faez (SC)</button>
      </div>
    </div>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="app" style="display:none">
  <header class="topbar">
    <div class="brand"><span class="logo-icon"><svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round"><path d="M 82 30 A 40 40 0 1 0 82 70 L 55 70" fill="none"/><line x1="50" y1="50" x2="50" y2="22"/><line x1="50" y1="50" x2="90" y2="50"/></svg></span><span class="logo-text"><span class="ym">ym</span>Track</span></div>
    <div class="who">
      <span id="who-text"></span>
      <button id="logout-btn">Log out</button>
    </div>
  </header>
  <nav class="tabs" id="tab-nav"></nav>
  <main id="view"></main>
</div>

<script>
// ============ State ============
const state = {
  token: localStorage.getItem('gymtrack.token') || null,
  user: JSON.parse(localStorage.getItem('gymtrack.user') || 'null'),
  leads: [],
  appointments: [],
  targets: [],
  ratios: [],
  users: [],
  currentTab: 'dashboard',
  calendarView: 'month',
  calendarAnchor: new Date(),
  ratioView: 'combined',
  ratioPeriodType: 'daily',
  ratioMonth: isoOf(new Date()).slice(0,7),
  dashMode: 'month',
  dashMonth: isoOf(new Date()).slice(0,7),
  dashOwner: 'all',
};

const STAGES = ['New', 'Follow Up', 'APPT', 'Show', 'Closed'];
const NON_PIPELINE = ['Joined', 'Not Interested', 'No Answer', 'No Show'];
const BRANCH_LABEL = { sb: 'Trillium Sungai Besi', bg: 'Evo Mall Bangi', os: 'One Shamelin Mall' };
const BRANCH_WA = {
  sb: { name: 'Anytime Fitness Trillium, Sungai Besi', maps: 'https://www.google.com/maps/search/?api=1&query=Anytime+Fitness+Trillium+Sungai+Besi' },
  bg: { name: 'Anytime Fitness Evo Mall, Bangi',       maps: 'https://www.google.com/maps/search/?api=1&query=Anytime+Fitness+Evo+Mall+Bangi' },
  os: { name: 'Anytime Fitness One Shamelin Mall',     maps: 'https://www.google.com/maps/search/?api=1&query=Anytime+Fitness+One+Shamelin+Mall' },
};
const APPT_TYPE_WA = { tour: 'gym tour \u{1F3CB}\u{FE0F}', followup: 'follow-up session \u{1F4AC}', call: 'phone call \u{1F4DE}' };
const APPT_STATUSES = [
  { key: 'booked',    label: 'Appointment Booked', color: '#9b59b6', text: '#fff' },
  { key: 'followup',  label: 'Follow Up',          color: '#8a929c', text: '#fff' },
  { key: 'noshow',    label: 'No Show',            color: '#1a1a1a', text: '#fff' },
  { key: 'trial',     label: 'Free Trial',         color: '#337ab7', text: '#fff' },
  { key: 'notjoined', label: 'Did Not Join',       color: '#e67e22', text: '#fff' },
  { key: 'confirmed', label: 'Confirmed',          color: '#f1c40f', text: '#222' },
  { key: 'joined',    label: 'Joined',             color: '#2ecc71', text: '#fff' },
];
// legacy status values from before this scheme
const LEGACY_STATUS = { scheduled: 'booked', showed: 'confirmed' };
// statuses that mean the lead physically showed up
const SHOWED_STATUSES = ['trial', 'joined', 'notjoined', 'showed'];
function apptStatusInfo(key) {
  const k = LEGACY_STATUS[key] || key;
  return APPT_STATUSES.find(s => s.key === k) || APPT_STATUSES[0];
}
const ROLE_TABS = {
  abm:   ['dashboard','pipeline','ratios','calendar','allLeads','org'],
  cm:    ['dashboard','pipeline','ratios','calendar','allLeads','org'],
  sc:    ['dashboard','pipeline','ratios','calendar','allLeads'],
};
const TAB_LABELS = {
  dashboard: 'Dashboard',
  pipeline:  'Pipeline',
  ratios:    'Ratios',
  calendar:  'Calendar',
  allLeads:  'All Leads',
  org:       'Org & Team',
};

const AF_BENCHMARKS = {
  callPickedUp: 0.16,
  callToAppt:   0.15,
  apptToShow:   0.40,
  showToClose:  0.50,
};

const SOURCE_COLORS = {
  'Walk-in': '#5cb85c', 'Social Media': '#f0ad4e', 'Social media': '#f0ad4e',
  'Website': '#d9534f', 'Referral': '#337ab7', 'WhatsApp': '#25d366',
  'Instagram': '#e1306c', 'Outreach': '#5bc0de', 'Phone call': '#9b59b6',
  'Event': '#1abc9c',
};

// ============ API ============
async function api(path, opts = {}) {
  const headers = Object.assign({ 'Content-Type': 'application/json' }, opts.headers || {});
  if (state.token) headers.Authorization = 'Bearer ' + state.token;
  const res = await fetch(path, Object.assign({}, opts, { headers }));
  if (res.status === 401) { logout(); throw new Error('unauthorized'); }
  if (!res.ok) { const msg = await res.text(); throw new Error(msg || ('HTTP ' + res.status)); }
  if (res.status === 204) return null;
  return res.json();
}

async function loadAll() {
  const promises = [
    api('/api/leads'),
    api('/api/appointments'),
    api('/api/targets'),
    api('/api/ratios?period_type=' + state.ratioPeriodType + '&month=' + state.ratioMonth),
  ];
  if (state.user.role !== 'sc') promises.push(api('/api/users'));
  const [leads, appts, targets, ratios, users] = await Promise.all(promises);
  state.leads = leads;
  state.appointments = appts;
  state.targets = targets;
  state.ratios = ratios;
  if (users) state.users = users;
}

// ============ Auth ============
function logout() {
  localStorage.removeItem('gymtrack.token');
  localStorage.removeItem('gymtrack.user');
  state.token = null; state.user = null;
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('app').style.display = 'none';
}

document.getElementById('logout-btn').onclick = logout;

window.quickLogin = (u, p) => {
  document.getElementById('login-username').value = u;
  document.getElementById('login-password').value = p;
  document.getElementById('login-form').dispatchEvent(new Event('submit', { cancelable: true }));
};

document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const err = document.getElementById('login-error');
  err.textContent = '';
  const username = document.getElementById('login-username').value.trim();
  const password = document.getElementById('login-password').value;
  try {
    const r = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password }),
    });
    if (!r.ok) { err.textContent = 'Invalid credentials'; return; }
    const data = await r.json();
    state.token = data.token; state.user = data.user;
    localStorage.setItem('gymtrack.token', data.token);
    localStorage.setItem('gymtrack.user', JSON.stringify(data.user));
    await bootApp();
  } catch (e) { err.textContent = 'Login failed'; }
});

// ============ Boot ============
async function bootApp() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  const dn = state.user.displayName || state.user.username;
  document.getElementById('who-text').textContent = `${dn} · ${state.user.role.toUpperCase()} · ${state.user.branches.map(b => BRANCH_LABEL[b] || b).join(', ')}`;
  renderTabs();
  try { await loadAll(); } catch (e) { console.error(e); }
  render();
}

function renderTabs() {
  const nav = document.getElementById('tab-nav');
  const tabs = ROLE_TABS[state.user.role] || ROLE_TABS.sc;
  if (!tabs.includes(state.currentTab)) state.currentTab = tabs[0];
  nav.innerHTML = '';
  for (const t of tabs) {
    const b = document.createElement('button');
    b.textContent = TAB_LABELS[t];
    if (t === state.currentTab) b.className = 'active';
    b.onclick = () => { state.currentTab = t; renderTabs(); render(); };
    nav.appendChild(b);
  }
}

// ============ Helpers ============
function daysSince(iso) { if (!iso) return 0; return Math.floor((Date.now() - new Date(iso).getTime()) / 86400000); }
function isoOf(d) { return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function todayIso() { return isoOf(new Date()); }
function niceDate(iso) {
  const [y,m,d] = iso.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  const days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  return `${days[dt.getDay()]}, ${d} ${months[m-1]} ${y}`;
}
function time12(hhmm) {
  let [h, min] = hhmm.split(':').map(Number);
  const ampm = h >= 12 ? 'PM' : 'AM';
  h = h % 12 || 12;
  return `${h}:${String(min).padStart(2,'0')} ${ampm}`;
}

// ============ SVG charts ============
const STAGE_COLORS = {
  'New':'#5bc0de', 'Follow Up':'#f0ad4e', 'APPT':'#00A86B', 'Show':'#337ab7', 'Closed':'#5cb85c',
  'Joined':'#2ecc71', 'Not Interested':'#d9534f', 'No Answer':'#8a929c', 'No Show':'#e8542e',
};

function pieSvg(data, size=200) {
  const total = data.reduce((s,d)=>s+d.value,0);
  if (!total) return '<div class="muted">No data</div>';
  const cx=size/2, cy=size/2, r=size/2-4;
  let angle=-Math.PI/2;
  const paths = data.filter(d=>d.value>0).map(d=>{
    const frac=d.value/total;
    const a2=angle+frac*2*Math.PI;
    let p;
    if (frac>=0.999) {
      p=`M ${cx-r} ${cy} A ${r} ${r} 0 1 1 ${cx+r} ${cy} A ${r} ${r} 0 1 1 ${cx-r} ${cy}`;
    } else {
      const x1=cx+r*Math.cos(angle), y1=cy+r*Math.sin(angle);
      const x2=cx+r*Math.cos(a2),   y2=cy+r*Math.sin(a2);
      p=`M ${cx} ${cy} L ${x1.toFixed(2)} ${y1.toFixed(2)} A ${r} ${r} 0 ${frac>0.5?1:0} 1 ${x2.toFixed(2)} ${y2.toFixed(2)} Z`;
    }
    angle=a2;
    return `<path d="${p}" fill="${d.color}" stroke="#23272e" stroke-width="2"><title>${escapeHtml(d.label)}: ${d.value} (${Math.round(frac*100)}%)</title></path>`;
  }).join('');
  return `<svg viewBox="0 0 ${size} ${size}" style="width:${size}px;max-width:100%;flex:0 0 auto">${paths}</svg>`;
}

function chartLegend(data) {
  const total = data.reduce((s,d)=>s+d.value,0)||1;
  return data.map(d=>`
    <div class="legend-row">
      <span class="legend-chip" style="background:${d.color}"></span>
      <span class="legend-label">${escapeHtml(d.label)}</span>
      <span class="legend-val">${d.value}</span>
      <span class="legend-pct">${Math.round(d.value/total*100)}%</span>
    </div>`).join('');
}

function funnelSvg(stages) {
  const max = Math.max(...stages.map(s=>s.value), 1);
  const W=460, rowH=46, w0=W-140;
  const rows = stages.map((s,i)=>{
    const w=Math.max(w0*(s.value/max), 4);
    const y=i*rowH;
    const inside = w > 150;
    return `<rect x="0" y="${y}" width="${w.toFixed(1)}" height="${rowH-9}" rx="4" fill="${s.color}"><title>${s.label}: ${s.value}</title></rect>
      <text x="${inside ? 12 : (w+10).toFixed(1)}" y="${y+(rowH-9)/2+5}" font-size="13" font-weight="600" fill="${inside ? '#fff' : '#e8eaed'}">${s.label} — ${s.value}</text>`;
  }).join('');
  return `<svg viewBox="0 0 ${W} ${stages.length*rowH}" style="width:100%;max-width:540px;display:block">${rows}</svg>`;
}

// buckets: [{ label, leads }] — stacked by lead source
function stackedSvg(buckets) {
  const perBucket = buckets.map(b => {
    const g = {};
    b.leads.forEach(l => { const s = l.source || 'Other'; g[s] = (g[s] || 0) + 1; });
    return { label: b.label, g, total: b.leads.length };
  });
  const max = Math.max(...perBucket.map(d => d.total), 1);
  const n = perBucket.length;
  const bw = n > 12 ? 20 : 46, gap = n > 12 ? 8 : 20;
  const H = 175, chartH = 130, top = 16;
  const W = n * (bw + gap) + 10;
  let bars = '';
  perBucket.forEach((d, i) => {
    const x = 5 + i * (bw + gap);
    let y = top + chartH;
    Object.entries(d.g).forEach(([s, c]) => {
      const h = c / max * chartH;
      y -= h;
      bars += `<rect x="${x}" y="${y.toFixed(1)}" width="${bw}" height="${h.toFixed(1)}" rx="1" fill="${srcColor(s)}"><title>${escapeHtml(d.label)} · ${escapeHtml(s)}: ${c}</title></rect>`;
    });
    if (d.total) bars += `<text x="${x+bw/2}" y="${(y-4).toFixed(1)}" text-anchor="middle" font-size="10" font-weight="600" fill="#e8eaed">${d.total}</text>`;
    bars += `<text x="${x+bw/2}" y="${H-4}" text-anchor="middle" font-size="8.5" fill="#9aa4b3">${escapeHtml(d.label)}</text>`;
  });
  return `<div style="overflow-x:auto"><svg viewBox="0 0 ${W} ${H}" style="min-width:${Math.min(W, 900)}px;height:${H}px;display:block">${bars}</svg></div>`;
}
function monthKey(d=new Date()) { return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0'); }
function escapeHtml(s) { return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function srcColor(src) { return SOURCE_COLORS[src] || '#999'; }

// ============ Render router ============
function render() {
  const v = document.getElementById('view');
  v.innerHTML = '';
  switch (state.currentTab) {
    case 'dashboard': return renderDashboard(v);
    case 'pipeline':  return renderPipeline(v);
    case 'ratios':    return renderRatios(v);
    case 'calendar':  return renderCalendar(v);
    case 'allLeads':  return renderAllLeads(v);
    case 'org':       return renderOrg(v);
  }
}

// ---------- Dashboard ----------
window.setDashMode = (mode, month) => {
  state.dashMode = mode;
  if (month) state.dashMonth = month;
  render();
};
window.setDashOwner = (v) => { state.dashOwner = v; render(); };

function dashRange() {
  if (state.dashMode === 'month') {
    const [y, m] = state.dashMonth.split('-').map(Number);
    return {
      start: state.dashMonth + '-01',
      end: isoOf(new Date(y, m, 0)),
      months: [state.dashMonth],
      label: new Date(y, m - 1, 1).toLocaleString(undefined, { month: 'long', year: 'numeric' }),
    };
  }
  const n = state.dashMode === '3m' ? 3 : 6;
  const now = new Date();
  const startD = new Date(now.getFullYear(), now.getMonth() - (n - 1), 1);
  const months = [];
  for (let i = 0; i < n; i++) months.push(monthKey(new Date(startD.getFullYear(), startD.getMonth() + i, 1)));
  return { start: isoOf(startD), end: todayIso(), months, label: `Last ${n} Months` };
}

function renderDashboard(root) {
  const range = dashRange();
  const inRange = d => d && d >= range.start && d <= range.end;

  // ABM/CM can focus the whole dashboard on a single SC
  const canFilterSc = state.user.role !== 'sc';
  const ownerFilter = canFilterSc ? (state.dashOwner || 'all') : 'all';
  const baseLeads = ownerFilter === 'all' ? state.leads : state.leads.filter(l => l.owner === ownerFilter);
  const baseAppts = ownerFilter === 'all' ? state.appointments : state.appointments.filter(a => a.owner === ownerFilter);

  const periodLeads = baseLeads.filter(l => inRange(l.dateAdded));
  const periodAppts = baseAppts.filter(a => inRange(a.date));
  const closed = periodLeads.filter(l => l.stage === 'Closed' || l.stage === 'Joined');

  // target: sum across the period months for the SC(s) in view (fallback 20/month/SC)
  let targetOwners;
  if (!canFilterSc) targetOwners = [state.user.username];
  else if (ownerFilter !== 'all') targetOwners = [ownerFilter];
  else {
    const scs = state.users.filter(u => u.role === 'sc').map(u => u.username);
    targetOwners = scs.length ? scs : [state.user.username];
  }
  const foundTargets = [];
  for (const o of targetOwners) for (const mk2 of range.months) {
    const t = state.targets.find(x => x.owner === o && x.month === mk2);
    if (t) foundTargets.push(t.leadsTarget);
  }
  const leadsTarget = foundTargets.length
    ? foundTargets.reduce((s, v) => s + v, 0)
    : 20 * range.months.length * targetOwners.length;
  const pct = (n,t) => t ? Math.min(100, Math.round(n/t*100)) : 0;

  // "now" metric — not affected by the period filter (but follows the SC filter)
  const inactive = baseLeads.filter(l =>
    l.stage !== 'Closed' && l.stage !== 'Joined' && l.stage !== 'Not Interested' && daysSince(l.lastTouched) >= 7
  );

  const sourceCounts = {};
  for (const l of periodLeads) {
    const s = l.source || 'Other';
    sourceCounts[s] = (sourceCounts[s] || 0) + 1;
  }

  // Stage summary (within period)
  const stageCounts = {};
  for (const l of periodLeads) stageCounts[l.stage] = (stageCounts[l.stage] || 0) + 1;

  // stacked chart buckets: daily within a month, monthly for 3m/6m
  let buckets, chartTitle;
  if (state.dashMode === 'month') {
    const [y, m] = state.dashMonth.split('-').map(Number);
    const dim = new Date(y, m, 0).getDate();
    buckets = [];
    for (let d = 1; d <= dim; d++) {
      const iso = `${state.dashMonth}-${String(d).padStart(2,'0')}`;
      buckets.push({ label: String(d), leads: periodLeads.filter(l => l.dateAdded === iso) });
    }
    chartTitle = `New Leads — ${range.label} (daily)`;
  } else {
    buckets = range.months.map(mk2 => ({
      label: mk2.slice(5) + '/' + mk2.slice(2, 4),
      leads: periodLeads.filter(l => l.dateAdded && l.dateAdded.startsWith(mk2)),
    }));
    chartTitle = 'New Leads by Month';
  }

  // Chart data
  const srcData = Object.entries(sourceCounts)
    .sort((a,b) => b[1] - a[1])
    .map(([s,c]) => ({ label: s, value: c, color: srcColor(s) }));
  const funnelData = STAGES.map(s => ({ label: s, value: stageCounts[s] || 0, color: STAGE_COLORS[s] }));
  const stageData = [...STAGES, ...NON_PIPELINE]
    .filter(s => stageCounts[s])
    .map(s => ({ label: s, value: stageCounts[s], color: STAGE_COLORS[s] || '#999' }));
  const nonPipeData = NON_PIPELINE
    .filter(s => stageCounts[s])
    .map(s => ({ label: s, value: stageCounts[s], color: STAGE_COLORS[s] || '#999' }));

  const showedCount = periodAppts.filter(a => SHOWED_STATUSES.includes(a.status)).length;

  root.innerHTML = `
    <div class="card" style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
      <h2 style="margin:0">Overview &mdash; ${range.label}${ownerFilter !== 'all' ? ' &middot; ' + escapeHtml((state.users.find(u=>u.username===ownerFilter)||{}).displayName || ownerFilter) : ''}</h2>
      <span style="flex:1"></span>
      ${canFilterSc ? `<select onchange="setDashOwner(this.value)" style="padding:8px 12px;border:1px solid var(--border);border-radius:4px;background:#262a30">
        <option value="all">All SCs</option>
        ${state.users.filter(u=>u.role==='sc').map(u=>`<option value="${u.username}" ${ownerFilter===u.username?'selected':''}>${escapeHtml(u.displayName||u.username)}</option>`).join('')}
      </select>` : ''}
      <button class="btn ${state.dashMode==='month' && state.dashMonth===monthKey() ? '' : 'secondary'}" onclick="setDashMode('month','${monthKey()}')">This Month</button>
      <button class="btn ${state.dashMode==='3m' ? '' : 'secondary'}" onclick="setDashMode('3m')">Last 3 Months</button>
      <button class="btn ${state.dashMode==='6m' ? '' : 'secondary'}" onclick="setDashMode('6m')">Last 6 Months</button>
      <input type="month" value="${state.dashMonth}" max="${monthKey()}" onchange="setDashMode('month', this.value)" style="padding:8px 12px;border:1px solid var(--border);border-radius:4px;background:#262a30" title="Jump to a past month" />
    </div>

    ${inactive.length ? `<div class="alert">&#9888; ${inactive.length} lead${inactive.length>1?'s':''} not touched in 7+ days. Review under "All Leads".</div>` : ''}

    <div class="kpi-grid">
      <div class="kpi-card">
        <div class="kpi-label">Leads (${range.label})</div>
        <div class="kpi-val">${periodLeads.length}</div>
        <div class="kpi-sub">${baseLeads.length} all time</div>
      </div>
      <div class="kpi-card green">
        <div class="kpi-label">Leads Target</div>
        <div class="kpi-val">${pct(periodLeads.length, leadsTarget)}%</div>
        <div class="kpi-sub">${periodLeads.length} / ${leadsTarget}</div>
        <div class="progress" style="margin-top:8px"><div style="width:${pct(periodLeads.length, leadsTarget)}%"></div></div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Appointments</div>
        <div class="kpi-val">${periodAppts.length}</div>
        <div class="kpi-sub">${range.label}</div>
      </div>
      <div class="kpi-card ${closed.length > 0 ? 'green' : ''}">
        <div class="kpi-label">Closed / Joined</div>
        <div class="kpi-val">${closed.length}</div>
        <div class="kpi-sub">${range.label}</div>
      </div>
      <div class="kpi-card ${inactive.length > 5 ? 'red' : inactive.length > 0 ? 'amber' : 'green'}">
        <div class="kpi-label">Inactive (7d+)</div>
        <div class="kpi-val">${inactive.length}</div>
        <div class="kpi-sub">Needs follow-up (all time)</div>
      </div>
    </div>

    <div class="row">
      <div class="col card">
        <h2>KPI Summary</h2>
        <table class="kpi-table">
          <thead><tr><th>KPI</th><th style="text-align:center">Actual</th><th style="text-align:center">Target</th><th>Status</th></tr></thead>
          <tbody>
            <tr>
              <td class="kpi-name">Leads Added</td>
              <td class="kpi-actual">${periodLeads.length}</td>
              <td class="kpi-target">${leadsTarget}</td>
              <td><span class="pill ${periodLeads.length >= leadsTarget ? 'green' : periodLeads.length >= leadsTarget * 0.7 ? 'amber' : 'red'}">${periodLeads.length >= leadsTarget ? 'On Track' : 'Behind'}</span></td>
            </tr>
            <tr>
              <td class="kpi-name">Appointments Set</td>
              <td class="kpi-actual">${periodAppts.length}</td>
              <td class="kpi-target">-</td>
              <td><span class="pill gray">-</span></td>
            </tr>
            <tr>
              <td class="kpi-name">Show Rate</td>
              <td class="kpi-actual">${periodAppts.length ? Math.round(showedCount / periodAppts.length * 100) : 0}%</td>
              <td class="kpi-target">40%</td>
              <td><span class="pill ${periodAppts.length && showedCount / periodAppts.length >= 0.4 ? 'green' : 'red'}">${periodAppts.length && showedCount / periodAppts.length >= 0.4 ? 'On Track' : 'Below'}</span></td>
            </tr>
            <tr>
              <td class="kpi-name">Close Rate</td>
              <td class="kpi-actual">${periodLeads.length ? Math.round(closed.length / periodLeads.length * 100) : 0}%</td>
              <td class="kpi-target">50%</td>
              <td><span class="pill gray">-</span></td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <div class="row">
      <div class="col card">
        <h2>Leads by Source</h2>
        <div class="chart-flex">
          <div class="legend">${chartLegend(srcData)}</div>
          ${pieSvg(srcData)}
        </div>
      </div>
      <div class="col card">
        <h2>Sales Funnel</h2>
        ${funnelSvg(funnelData)}
        ${nonPipeData.length ? `<div class="muted" style="margin-top:10px;text-align:center">${nonPipeData.map(d => `${d.label}: <strong style="color:${d.color}">${d.value}</strong>`).join(' &nbsp;·&nbsp; ')}</div>` : ''}
      </div>
    </div>

    <div class="row">
      <div class="col card">
        <h2>Lead Status Breakdown</h2>
        <div class="chart-flex">
          <div class="legend">${chartLegend(stageData)}</div>
          ${pieSvg(stageData)}
        </div>
      </div>
      <div class="col card">
        <h2>${chartTitle}</h2>
        ${stackedSvg(buckets)}
        <div class="muted" style="margin-top:6px">Stacked by source · hover a bar for details</div>
      </div>
    </div>

    <div class="card">
      <h2>Today &amp; Tomorrow</h2>
      ${renderUpcomingTable()}
    </div>
  `;
}

function renderUpcomingTable() {
  const today = todayIso();
  const tom = new Date(); tom.setDate(tom.getDate()+1);
  const tomIso = isoOf(tom);
  const list = state.appointments
    .filter(a => a.date === today || a.date === tomIso)
    .sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
  if (!list.length) return '<div class="muted" style="padding:8px 0">No appointments scheduled for today or tomorrow.</div>';
  return `<table><thead><tr><th>When</th><th>Lead</th><th>Type</th><th>Status</th><th>Actions</th></tr></thead><tbody>
    ${list.map(a => `
      <tr>
        <td>${a.date} ${a.time}</td>
        <td>${escapeHtml(a.leadName)}<br/><span class="muted">${escapeHtml(a.phone||'')}</span></td>
        <td><span class="pill gray">${a.type}</span></td>
        <td>${apptStatusPill(a.status)}</td>
        <td>
          <button class="btn small secondary" onclick="markAppt(${a.id},'confirmed')">Confirmed</button>
          <button class="btn small secondary" onclick="markAppt(${a.id},'noshow')">No Show</button>
          <button class="btn small secondary" onclick="markAppt(${a.id},'joined')">Joined</button>
        </td>
      </tr>
    `).join('')}
  </tbody></table>`;
}
function apptStatusPill(s) {
  const si = apptStatusInfo(s);
  return `<span class="pill" style="background:${si.color};color:${si.text}">${si.label}</span>`;
}

window.markAppt = async (id, status) => {
  await api('/api/appointments/'+id, { method:'PUT', body: JSON.stringify({ status }) });
  await loadAll(); render();
};

// ---------- Pipeline (drag & drop) ----------
const PIPE_PAGE_SIZE = 15;
window.pipePage = (stage, delta) => {
  state.pipePages = state.pipePages || {};
  state.pipePages[stage] = (state.pipePages[stage] || 0) + delta;
  render();
};

function renderPipeline(root) {
  state.pipePages = state.pipePages || {};
  const cols = STAGES.map(stage => {
    const allLeads = state.leads.filter(l => l.stage === stage);
    const pages = Math.max(1, Math.ceil(allLeads.length / PIPE_PAGE_SIZE));
    const page = Math.min(Math.max(state.pipePages[stage] || 0, 0), pages - 1);
    state.pipePages[stage] = page;
    const leads = allLeads.slice(page * PIPE_PAGE_SIZE, (page + 1) * PIPE_PAGE_SIZE);
    const pager = allLeads.length > PIPE_PAGE_SIZE ? `
      <div class="pipe-pager">
        <button ${page === 0 ? 'disabled' : ''} onclick="pipePage('${stage}', -1)">&#9664;</button>
        <span>${page + 1} / ${pages}</span>
        <button ${page >= pages - 1 ? 'disabled' : ''} onclick="pipePage('${stage}', 1)">&#9654;</button>
      </div>` : '';
    return `
      <div class="pipe-col" data-stage="${stage}">
        <h3>${stage} <span class="count">${allLeads.length}</span></h3>
        ${pager}
        ${leads.map(l => `
          <div class="lead-card" draggable="true" data-id="${l.id}">
            <div class="lname">${escapeHtml(l.name)}</div>
            <div class="lmeta">${escapeHtml(l.phone||'')} · ${escapeHtml(l.source||'')}</div>
            <div class="lmeta">Owner: ${escapeHtml(l.owner)}</div>
            <div style="margin-top:6px; display:flex; gap:4px; flex-wrap:wrap">
              <button class="btn small secondary" onclick="editLead(${l.id})">Edit</button>
              <button class="btn small secondary" onclick="bookAppt(${l.id})">Book</button>
            </div>
          </div>
        `).join('')}
      </div>`;
  }).join('');

  root.innerHTML = `
    <div class="card" style="display:flex;justify-content:space-between;align-items:center">
      <h2 style="margin:0">Pipeline</h2>
      <div style="display:flex;gap:8px">
        <button class="btn secondary" onclick="logCall()">&#128222; Log Call</button>
        <button class="btn" onclick="newLead()">+ New Lead</button>
      </div>
    </div>
    <div class="pipeline">${cols}</div>
  `;

  let draggingId = null;
  root.querySelectorAll('.lead-card').forEach(el => {
    el.addEventListener('dragstart', () => { draggingId = el.dataset.id; el.classList.add('dragging'); });
    el.addEventListener('dragend',   () => { el.classList.remove('dragging'); draggingId = null; });
  });
  root.querySelectorAll('.pipe-col').forEach(col => {
    col.addEventListener('dragover', (e) => { e.preventDefault(); col.classList.add('drop-over'); });
    col.addEventListener('dragleave', () => col.classList.remove('drop-over'));
    col.addEventListener('drop', async (e) => {
      e.preventDefault(); col.classList.remove('drop-over');
      if (!draggingId) return;
      const newStage = col.dataset.stage;
      const lead = state.leads.find(l => String(l.id) === String(draggingId));
      if (!lead || lead.stage === newStage) return;
      await api('/api/leads/'+lead.id, { method:'PUT', body: JSON.stringify({ stage: newStage }) });
      if (newStage === 'APPT') bookAppt(lead.id);
      await loadAll(); render();
    });
  });
}

window.logCall = () => {
  const leads = state.leads.slice().sort((a,b) => a.name.localeCompare(b.name));
  const m = modal(`
    <h3>&#128222; Log Call Attempt</h3>
    <div class="modal-body">
      <label>Lead</label>
      <input id="lc-lead" list="lc-leads" placeholder="Type to search name or phone...">
      <datalist id="lc-leads">${leads.map(l => `<option value="${escapeHtml(l.name)} (${escapeHtml(l.phone||'no phone')})"></option>`).join('')}</datalist>
      <label>Outcome</label>
      <select id="lc-outcome">
        <option value="noanswer">No Answer</option>
        <option value="ni">Picked Up &mdash; Not Interested</option>
        <option value="fu">Picked Up &mdash; Follow Up</option>
        <option value="appt">Picked Up &mdash; Appointment Set</option>
      </select>
      <label>Note (optional)</label>
      <textarea id="lc-note" rows="2" placeholder="e.g. asked to call back next week"></textarea>
      <div class="muted" style="margin-top:8px">Saving updates your call ratios for today. "Appointment Set" opens the booking form right after.</div>
    </div>
    <div class="actions">
      <button class="btn secondary" onclick="this.closest('.modal-back').remove()">Cancel</button>
      <button class="btn" id="lc-save">Save Call</button>
    </div>
  `);
  m.querySelector('#lc-save').onclick = async () => {
    const val = m.querySelector('#lc-lead').value.trim();
    const lead = leads.find(l => `${l.name} (${l.phone||'no phone'})` === val)
              || leads.find(l => l.name.toLowerCase() === val.toLowerCase());
    if (!lead) { alert('Please pick a lead from the list'); return; }
    const outcome = m.querySelector('#lc-outcome').value;
    const note = m.querySelector('#lc-note').value.trim();
    const me = state.user.username;
    const today = todayIso();

    // 1) bump today's ratio numbers
    const daily = await api('/api/ratios?period_type=daily&month=' + monthKey());
    const cur = daily.find(r => r.owner === me && r.period === today)
             || { callsPlaced: 0, pickedUp: 0, apptsSet: 0, showedUp: 0, closed: 0 };
    // appts-set is counted when the appointment itself is booked, so only calls/pickups here
    await api('/api/ratios', { method: 'PUT', body: JSON.stringify({
      owner: me, period: today, periodType: 'daily',
      callsPlaced: cur.callsPlaced + 1,
      pickedUp:    cur.pickedUp + (outcome === 'noanswer' ? 0 : 1),
      apptsSet:    cur.apptsSet,
      showedUp:    cur.showedUp,
      closed:      cur.closed,
    })});

    // 2) update the lead (stage + note + last-touched)
    const stageMap = { ni: 'Not Interested', fu: 'Follow Up', appt: 'APPT' };
    const body = {};
    if (stageMap[outcome] && lead.stage !== stageMap[outcome]) body.stage = stageMap[outcome];
    if (note) body.notes = (lead.notes ? lead.notes + '\n' : '') + `[${today}] Call: ${note}`;
    if (!Object.keys(body).length) body.notes = lead.notes || '';
    await api('/api/leads/' + lead.id, { method: 'PUT', body: JSON.stringify(body) });

    m.remove();
    await loadAll(); render();
    // 3) straight into booking if the call produced an appointment
    // (fromCall: the call/pickup was already counted above, so the
    //  appointment POST only adds the appt-set)
    if (outcome === 'appt') bookAppt(lead.id, { fromCall: true });
  };
};

async function reloadRatios() {
  state.ratios = await api('/api/ratios?period_type=' + state.ratioPeriodType + '&month=' + state.ratioMonth);
}

function renderRatioBody() {
  const body = document.getElementById('ratio-body');
  if (!body) return;

  let data = state.ratios;
  if (state.ratioView !== 'combined' && state.user.role !== 'sc') {
    data = data.filter(r => r.owner === state.ratioView);
  }

  const totals = { callsPlaced: 0, pickedUp: 0, apptsSet: 0, showedUp: 0, closed: 0 };
  for (const r of data) {
    totals.callsPlaced += r.callsPlaced;
    totals.pickedUp += r.pickedUp;
    totals.apptsSet += r.apptsSet;
    totals.showedUp += r.showedUp;
    totals.closed += r.closed;
  }

  const ratios = {
    callPickedUp: totals.callsPlaced ? totals.pickedUp / totals.callsPlaced : 0,
    callToAppt:   totals.pickedUp ? totals.apptsSet / totals.pickedUp : 0,
    apptToShow:   totals.apptsSet ? totals.showedUp / totals.apptsSet : 0,
    showToClose:  totals.showedUp ? totals.closed / totals.showedUp : 0,
  };

  function statusClass(val, bench) {
    if (val >= bench) return 'status-green';
    if (val >= bench * 0.7) return 'status-amber';
    return 'status-red';
  }

  const cards = [
    { label: 'Call Pickup %', val: ratios.callPickedUp, bench: AF_BENCHMARKS.callPickedUp },
    { label: 'Call to Appt %', val: ratios.callToAppt, bench: AF_BENCHMARKS.callToAppt },
    { label: 'Appt to Show %', val: ratios.apptToShow, bench: AF_BENCHMARKS.apptToShow },
    { label: 'Show to Close %', val: ratios.showToClose, bench: AF_BENCHMARKS.showToClose },
  ];

  const hasData = totals.callsPlaced > 0;

  body.innerHTML = `
    <div class="row" style="margin-bottom:16px">
      ${cards.map(c => `
        <div class="col card ratio-card ${hasData ? statusClass(c.val, c.bench) : ''}">
          <div class="ratio-val">${hasData ? Math.round(c.val*100)+'%' : '—'}</div>
          <div class="ratio-label">${c.label}</div>
          <div class="ratio-bench">AF Benchmark: ${Math.round(c.bench*100)}%</div>
        </div>
      `).join('')}
    </div>

    ${hasData ? `
    <div class="card">
      <h2>You vs AF Benchmarks</h2>
      <div class="bench-chart">
        ${cards.map(c => {
          const youPct = Math.min(100, Math.round(c.val * 100));
          const afPct = Math.round(c.bench * 100);
          const maxPct = Math.max(youPct, afPct, 1);
          const youW = youPct / maxPct * 100;
          const afW = afPct / maxPct * 100;
          const youColor = statusClass(c.val, c.bench) === 'status-green' ? 'var(--green)' : statusClass(c.val, c.bench) === 'status-amber' ? 'var(--amber)' : 'var(--red)';
          return `
            <div class="bench-row">
              <div class="bench-lbl">${c.label}</div>
              <div class="bench-bars">
                <div class="you-bar" style="width:${youW}%;background:${youColor}"></div>
                <div class="af-bar" style="width:${afW}%"></div>
              </div>
              <div class="bench-vals">${youPct}% / ${afPct}%</div>
            </div>
          `;
        }).join('')}
        <div style="font-size:11px;color:var(--text-muted);margin-top:8px">Top bar = You &middot; Bottom bar = AF Benchmark</div>
      </div>
    </div>
    ` : '<div class="card"><div class="muted">No ratio data for this period. Use "+ Log Numbers" to enter your daily/weekly/monthly activity.</div></div>'}

    <div class="card" style="padding:0;overflow:auto">
      <table>
        <thead><tr><th>Period</th><th>Owner</th><th>Calls</th><th>Picked Up</th><th>Appts Set</th><th>Showed</th><th>Closed</th></tr></thead>
        <tbody>
          ${data.length ? data.map(r => `
            <tr>
              <td>${r.period}</td><td>${escapeHtml(r.owner)}</td>
              <td>${r.callsPlaced}</td><td>${r.pickedUp}</td>
              <td>${r.apptsSet}</td><td>${r.showedUp}</td><td>${r.closed}</td>
            </tr>
          `).join('') : '<tr><td colspan="7" class="muted">No data</td></tr>'}
        </tbody>
      </table>
    </div>
  `;
}

function renderCalendar(root) {
  const v = state.calendarView;
  root.innerHTML = `
    <div class="card" style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
      <button class="btn secondary" onclick="calNav(-1)">◀</button>

      <button class="btn secondary" onclick="calNav(1)">▶</button>
      <span style="flex:1"></span>
      <button class="btn ${v==='month'?'':'secondary'}" onclick="calView('month')">Month</button>
      <button class="btn ${v==='week'?'':'secondary'}"  onclick="calView('week')">Week</button>
      <button class="btn" onclick="newAppt()">+ New Appointment</button>
    </div>

  `;
  if (v === 'month') drawMonth();

window.calNav = (delta) => {
  const d = state.calendarAnchor;
  if (state.calendarView === 'month') d.setMonth(d.getMonth() + delta);
  else d.setDate(d.getDate() + 7 * delta);
  render();
};
window.calView = (v) => { state.calendarView = v; render(); };

function drawMonth() {
  const d = state.calendarAnchor;
  const y = d.getFullYear(), m = d.getMonth();
  document.getElementById('cal-title').textContent =
    d.toLocaleString(undefined,{month:'long', year:'numeric'});
  const first = new Date(y, m, 1);
  const start = new Date(first); start.setDate(1 - first.getDay());
  const cells = [];
  for (let i=0; i<42; i++) { const dd = new Date(start); dd.setDate(start.getDate()+i); cells.push(dd); }
  const today = todayIso();
  const html = ['<div class="cal-grid">'];
  ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].forEach(n => html.push(`<div class="cal-cell" style="min-height:auto;background:var(--primary);color:#fff;font-weight:600;text-align:center;border-color:var(--primary)"><div class="d" style="color:#fff">${n}</div></div>`));
  for (const c of cells) {
    const iso = isoOf(c);
    const inMonth = c.getMonth() === m;
    const evts = state.appointments.filter(a => a.date === iso);
    html.push(`<div class="cal-cell ${iso===today?'today':''}" style="${inMonth?'':'opacity:.4'}">
      <div class="d">${c.getDate()}</div>
      ${evts.map(a => { const si = apptStatusInfo(a.status); return `<div class="cal-evt" style="background:${si.color};color:${si.text}" onclick="editAppt(${a.id})" title="${si.label}">${a.time} ${escapeHtml(a.leadName)}</div>`; }).join('')}
    </div>`);
  }
  html.push('</div>');
  html.push(`<div class="cal-legend">${APPT_STATUSES.map(s => `<span class="legend-chip" style="background:${s.color}"></span> ${s.label}`).join(' &nbsp; ')}</div>`);
  document.getElementById('cal-body').innerHTML = html.join('');
}
function drawWeek() {
  const d = state.calendarAnchor;
  const start = new Date(d); start.setDate(d.getDate() - d.getDay());
  document.getElementById('cal-title').textContent = 'Week of ' + start.toLocaleDateString();
  const today = todayIso();
  const html = ['<div class="cal-grid">'];
  for (let i=0; i<7; i++) {
    const c = new Date(start); c.setDate(start.getDate()+i);
    const iso = isoOf(c);
    const evts = state.appointments.filter(a => a.date === iso).sort((a,b)=>a.time.localeCompare(b.time));
    html.push(`<div class="cal-cell ${iso===today?'today':''}" style="min-height:200px">
      <div class="d">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][i]} ${c.getDate()}/${c.getMonth()+1}</div>
      ${evts.map(a => { const si = apptStatusInfo(a.status); return `<div class="cal-evt" style="background:${si.color};color:${si.text}" onclick="editAppt(${a.id})" title="${si.label}">${a.time}<br/>${escapeHtml(a.leadName)}</div>`; }).join('')}
    </div>`);
  }
  html.push('</div>');
  html.push(`<div class="cal-legend">${APPT_STATUSES.map(s => `<span class="legend-chip" style="background:${s.color}"></span> ${s.label}`).join(' &nbsp; ')}</div>`);
  document.getElementById('cal-body').innerHTML = html.join('');
}

window.exportCsv = () => {
  const rows = [['Name','Phone','Source','Stage','Owner','Branch','DateAdded','LastTouched','Notes']];
  for (const l of state.leads) {
    rows.push([l.name,l.phone,l.source,l.stage,l.owner,l.branch,l.dateAdded,l.lastTouched,(l.notes||'').replace(/\n/g,' ')]);

  const csv = rows.map(r => r.map(c => `"${String(c||'').replace(/"/g,'""')}"`).join(',')).join('\n');

  a.href = URL.createObjectURL(blob);
  a.download = 'gymtrack-leads-' + todayIso() + '.csv';
  a.click();

        return `
          <div style="border:1px solid var(--border); border-radius:4px; padding:12px; margin-bottom:8px; background:#262a30">
            <strong style="color:var(--text-primary)">${escapeHtml(sc.displayName || sc.username)}</strong>
            <div class="row" style="margin-top:8px">
              <div class="col"><label class="muted" style="text-transform:uppercase;letter-spacing:.5px">Leads target</label>
                <input type="number" value="${t.leadsTarget}" id="t-${sc.username}-leads" style="width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:4px;background:#262a30"></div>
              <div class="col" style="display:flex;align-items:flex-end">
                <button class="btn" onclick="saveTarget('${sc.username}','${mk}')">Save</button>
              </div>
            </div>
          </div>
        `;
      }).join('')}
    </div>
    <div class="card">
      <h2>Lead Reassignment</h2>
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
        <select id="reassign-lead" style="padding:8px 12px;border:1px solid var(--border);border-radius:4px;min-width:200px;background:#262a30">
          ${state.leads.map(l => `<option value="${l.id}">${escapeHtml(l.name)} (${escapeHtml(l.owner)})</option>`).join('')}
        </select>
        <span style="font-weight:600;color:var(--text-muted)">→</span>
        <select id="reassign-to" style="padding:8px 12px;border:1px solid var(--border);border-radius:4px;background:#262a30">
          ${scs.map(sc => `<option value="${sc.username}">${escapeHtml(sc.displayName || sc.username)}</option>`).join('')}
        </select>
        <button class="btn" onclick="reassignLead()">Reassign</button>
      </div>
    </div>
  `;
}

window.saveTarget = async (owner, month) => {
  const leadsTarget = Number(document.getElementById(`t-${owner}-leads`).value) || 0;
  await api('/api/targets', { method:'PUT', body: JSON.stringify({ owner, month, leadsTarget })});
  await loadAll(); render();
};

window.reassignLead = async () => {
  const leadId = document.getElementById('reassign-lead').value;
  const newOwner = document.getElementById('reassign-to').value;
  if (!leadId || !newOwner) return;
  await api('/api/leads/'+leadId, { method:'PUT', body: JSON.stringify({ owner: newOwner }) });
  await loadAll(); render();
};

// ---------- Modals: lead & appointment ----------
function modal(html) {
  const back = document.createElement('div');
  back.className = 'modal-back';
  back.innerHTML = `<div class="modal">${html}</div>`;
  back.addEventListener('click', e => { if (e.target === back) back.remove(); });
  document.body.appendChild(back);
  return back;
}

window.newLead = () => editLead(null);

window.editLead = (id) => {
  const l = id ? state.leads.find(x => x.id === id) : null;
  const canReassign = state.user.role !== 'sc';
  const m = modal(`
    <h3>${l ? 'Edit Lead' : 'New Lead'}</h3>
    <div class="modal-body">
    <label>Name</label><input id="ml-name" value="${escapeHtml(l?.name||'')}">
    <label>Phone</label><input id="ml-phone" value="${escapeHtml(l?.phone||'')}">
    <label>Source</label>
    <select id="ml-source">
      ${['Walk-in','Referral','Social Media','Website','WhatsApp','Instagram','Outreach','Phone call','Event','Other']
        .map(s => `<option ${l?.source===s?'selected':''}>${s}</option>`).join('')}
    </select>
    <label>Stage</label>
    <select id="ml-stage">${[...STAGES,...NON_PIPELINE].map(s=>`<option ${l?.stage===s?'selected':''}>${s}</option>`).join('')}</select>
    ${canReassign ? `<label>Owner</label><input id="ml-owner" value="${escapeHtml(l?.owner||state.user.username)}">` : ''}
    <label>Notes</label><textarea id="ml-notes" rows="3">${escapeHtml(l?.notes||'')}</textarea>
    </div>
    <div class="actions">
      <button class="btn secondary" onclick="this.closest('.modal-back').remove()">Cancel</button>
      <button class="btn" id="ml-save">Save</button>
    </div>
  `);
  m.querySelector('#ml-save').onclick = async () => {
    const body = {
      name:        m.querySelector('#ml-name').value.trim(),
      phone:       m.querySelector('#ml-phone').value.trim(),
      source:      m.querySelector('#ml-source').value,
      stage:       m.querySelector('#ml-stage').value,
      notes:       m.querySelector('#ml-notes').value,
      branch:      'sb',
    };
    if (canReassign) body.owner = m.querySelector('#ml-owner').value.trim();
    if (l) await api('/api/leads/'+l.id, { method:'PUT', body: JSON.stringify(body) });
    else   await api('/api/leads',       { method:'POST', body: JSON.stringify(body) });
    m.remove();
    await loadAll(); render();
  };
};

window.bookAppt = (leadId, opts) => {
  const l = state.leads.find(x => x.id === leadId);
  editAppt(null, l, opts);
};

window.newAppt = (lead) => editAppt(null, lead);

window.editAppt = (id, prefillLead, opts = {}) => {
  const a = id ? state.appointments.find(x => x.id === id) : null;
  const seedName  = a?.leadName  ?? prefillLead?.name  ?? '';
  const seedPhone = a?.phone     ?? prefillLead?.phone ?? '';
  const m = modal(`
    <h3>${a ? 'Edit Appointment' : 'New Appointment'}</h3>
    <div class="modal-body">
    <label>Lead Name</label><input id="ma-name" value="${escapeHtml(seedName)}">
    <label>Phone</label><input id="ma-phone" value="${escapeHtml(seedPhone)}">
    ${!a ? `<label>Lead Source</label>
    <select id="ma-source">${['Walk-in','Referral','Social Media','Website','WhatsApp','Instagram','Outreach','Phone call','Event','Other'].map(s=>`<option>${s}</option>`).join('')}</select>
    <div class="muted" style="margin-top:2px">If this number is new, it's added to your leads automatically</div>` : ''}
    <label>Date</label><input id="ma-date" type="date" value="${a?.date||todayIso()}">
    <label>Time</label><input id="ma-time" type="time" value="${a?.time||'10:00'}">
    <label>Status</label>
    <select id="ma-status">${APPT_STATUSES.map(s=>`<option value="${s.key}" ${apptStatusInfo(a?.status||'booked').key===s.key?'selected':''}>${s.label}</option>`).join('')}</select>
    <label>Reminder (days before)</label>
    <select id="ma-rem"><option value="0" ${a?.reminderDays===0?'selected':''}>None</option>${[1,2,3,7].map(s=>`<option value="${s}" ${a?.reminderDays===s?'selected':''}>${s} day${s>1?'s':''}</option>`).join('')}</select>
    <label>Notes</label><textarea id="ma-notes" rows="2">${escapeHtml(a?.notes||'')}</textarea>
    <label id="ma-wa-row" style="margin-top:12px;display:none"><input type="checkbox" id="ma-whatsapp" checked> Send WhatsApp confirmation on save</label>
    </div>
    <div class="actions">
      ${a ? `<button class="btn danger" id="ma-del">Delete</button>` : ''}
      <button class="btn secondary" onclick="this.closest('.modal-back').remove()">Cancel</button>
      <button class="btn" id="ma-save">Save</button>
    </div>
  `);
  if (a) m.querySelector('#ma-del').onclick = async () => {
    if (!confirm('Delete appointment?')) return;
    await api('/api/appointments/'+a.id, { method:'DELETE' });
    m.remove(); await loadAll(); render();
  };
  // WhatsApp option only appears for "Appointment Booked"
  const statusSel = m.querySelector('#ma-status');
  const waRow = m.querySelector('#ma-wa-row');
  const syncWaRow = () => { waRow.style.display = statusSel.value === 'booked' ? 'block' : 'none'; };
  statusSel.addEventListener('change', syncWaRow);
  syncWaRow();
  m.querySelector('#ma-save').onclick = async () => {
    const body = {
      leadName:     m.querySelector('#ma-name').value.trim(),
      phone:        m.querySelector('#ma-phone').value.trim(),
      date:         m.querySelector('#ma-date').value,
      time:         m.querySelector('#ma-time').value,
      type:         a?.type || 'tour',
      reminderDays: Number(m.querySelector('#ma-rem').value),
      status:       m.querySelector('#ma-status').value,
      branch:       'sb',
      notes:        m.querySelector('#ma-notes').value,
      leadSource:   m.querySelector('#ma-source')?.value,
      fromCall:     !!opts.fromCall,
    };
    const sendWa = body.status === 'booked' && m.querySelector('#ma-whatsapp').checked;
    // Open the window synchronously (before any await) so the popup blocker allows it
    const waWin = (sendWa && body.phone) ? window.open('', '_blank') : null;
    try {
      if (a) await api('/api/appointments/'+a.id, { method:'PUT', body: JSON.stringify(body)});
      else   await api('/api/appointments',       { method:'POST', body: JSON.stringify(body)});
    } catch (e) {
      if (waWin) waWin.close();
      throw e;
    }
    m.remove();
    if (waWin) {
      const loc = BRANCH_WA[body.branch] || BRANCH_WA.sb;
      const senderName = state.user.displayName || state.user.username;
      const typeLabel = APPT_TYPE_WA[body.type] || body.type;
      const text = encodeURIComponent(
`Hi ${body.leadName}! \u{1F44B}

This is ${senderName} from Anytime Fitness \u{1F4AA}

Just confirming your ${typeLabel}:

\u{1F4C5} ${niceDate(body.date)}
\u{1F552} ${time12(body.time)}
\u{1F4CD} ${loc.name}
${loc.maps}

See you there! \u{1F604} If you need to reschedule, just reply to this message ya \u{1F64F}`
      );
      let phone = body.phone.replace(/\D/g,'');
      // Convert Malaysian local format (01x...) to international (601x...)
      if (phone.startsWith('0')) phone = '6' + phone;
      waWin.location = `https://wa.me/${phone}?text=${text}`;
    }
    await loadAll(); render();
  };
};

// ============ Init ============
if (state.token && state.user) { bootApp(); }
</script>
</body>
</html>
